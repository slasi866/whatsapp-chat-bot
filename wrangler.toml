name = "pesat-wa-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret configuration. Secrets go in .dev.vars (local) or
# `wrangler secret put` (deployed) -- see .dev.vars.example.
[vars]
GRAPH_API_VERSION = "v23.0"
LLM_BASE_URL = "https://api.pesatrouter.com/v1"
DEFAULT_MODEL = "pesat-flash"
EMBEDDING_MODEL = "@cf/baai/bge-m3"

[observability]
enabled = true

# Dashboard served from the same Worker, so it shares an origin with /api and
# needs no CORS. not_found_handling is left at its default so that unmatched
# paths still reach the Worker; the dashboard routes on the URL hash instead.
[assets]
directory = "./public"

# --- D1: tenants, conversations, messages, leads, usage -------------------
# npx wrangler d1 create pesat-wa-bot   (paste the returned id below)
[[d1_databases]]
binding = "DB"
database_name = "pesat-wa-bot"
database_id = "39f0504c-6f7c-46aa-8d62-558e71006f3c"
migrations_dir = "migrations"

# --- Vectorize: per-tenant knowledge base embeddings ----------------------
# npx wrangler vectorize create pesat-kb --dimensions=1024 --metric=cosine
# npx wrangler vectorize create-metadata-index pesat-kb --property-name=tenant_id --type=string
[[vectorize]]
binding = "VECTORIZE"
index_name = "pesat-kb"

# --- Workers AI: embedding generation ------------------------------------
[ai]
binding = "AI"

# --- KV: tenant config cache and per-contact rate limiting ---------------
# npx wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "418ab728e3b84a3cb7fc55218cd32c42"

# Original document text is stored in D1 rather than R2: R2 requires a
# payment method on the account, and this platform is pinned to the
# Cloudflare free plan.

# --- Queue: webhook returns 200 fast, replies are generated off-thread ----
# npx wrangler queues create wa-inbound
# npx wrangler queues create wa-inbound-dlq
[[queues.producers]]
binding = "INBOUND"
queue = "wa-inbound"

[[queues.consumers]]
queue = "wa-inbound"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "wa-inbound-dlq"
